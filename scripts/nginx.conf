# Nginx reverse proxy para Vigilante Digital
# Ruta sugerida: /etc/nginx/conf.d/vigilante.conf
# TLS: coloca tus certificados en el volumen certs_data:
#   /etc/nginx/certs/vigilante.crt
#   /etc/nginx/certs/vigilante.key
# Con Let's Encrypt: certbot --nginx -d tu-dominio.com

server {
    listen 80;
    server_name _;
    # Redirigir todo HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/vigilante.crt;
    ssl_certificate_key /etc/nginx/certs/vigilante.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Seguridad HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Ocultar versión de nginx
    server_tokens off;

    # Tamaño máximo del body (frames JPEG)
    client_max_body_size 10M;

    # Proxy a la API FastAPI
    location / {
        proxy_pass         http://vigilante-api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # WebSocket para panel de operador
    location /operator/ws/ {
        proxy_pass         http://vigilante-api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
    }
}
