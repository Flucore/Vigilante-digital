<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía Digital — Panel de Operador</title>
<style>
/* Fuentes servidas por el propio panel (/operator/fonts, licencia OFL en
   OFL.txt): la UI no hace ninguna petición a internet. */
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:700;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("/operator/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("/operator/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url("/operator/fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2")}

/* Panel de operación nocturna: video protagonista + barra lateral de estado y bitácora.
   Tema único oscuro por decisión: se usa en salas con poca luz durante el turno de noche. */
:root{
  --bg:#090C10;
  --surface:#10151B;
  --raised:#161D25;
  --hover:#1C2530;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);
  --ink:#E9EEF2;
  --ink-2:#97A6B2;
  --ink-3:#5E6D79;
  --accent:#4CC2D3;
  --accent-soft:rgba(76,194,211,.12);
  --ok:#4FB872;
  --ok-soft:rgba(79,184,114,.12);
  --warn:#E2A443;
  --warn-soft:rgba(226,164,67,.13);
  --alert:#EE5A52;
  --alert-soft:rgba(238,90,82,.14);
  --radius:14px;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
button{font-family:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ── Encabezado ─────────────────────────────────────────── */
.top{
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:60px;flex:none;
  border-bottom:1px solid var(--line);
}
.mark{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:32px;height:32px;border-radius:9px;flex:none;
  display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
}
.mark b{font-size:15px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;display:block;line-height:1.2}
.mark span{font-size:12px;color:var(--ink-3);display:block}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;white-space:nowrap;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.dot.alert{background:var(--alert);box-shadow:0 0 0 3px var(--alert-soft)}
.clock{
  font-family:var(--font-mono);font-size:18px;font-weight:500;
  font-variant-numeric:tabular-nums;padding-left:8px;
}

/* ── Cuerpo ─────────────────────────────────────────────── */
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
/* Una columna por cámara; con una sola, ocupa todo el escenario */
.stage{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
  grid-auto-rows:minmax(0,1fr);
  min-width:0;min-height:0;padding:20px;gap:20px;overflow-y:auto;
}
.cam{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ── Vista expandida ─────────────────────────────────────
   Solo cambia clases y posición en la grilla: las tarjetas (y sus canvas)
   no se mueven en el DOM, así los WebSocket siguen pintando sin reconectar.
   --others lo fija applyLayout() con el número de cámaras de la tira. */
.stage.expanded{
  grid-template-columns:minmax(0,1fr) 280px;
  grid-auto-rows:minmax(0,1fr);
}
.stage.expanded .cam.is-focus{grid-column:1;grid-row:1 / span var(--others,3)}
.stage.expanded .cam:not(.is-focus){grid-column:2}
.stage.expanded .cam:not(.is-focus) .screen{min-height:0}
.stage.expanded .cam:not(.is-focus) .feed-head .right,
.stage.expanded .cam:not(.is-focus) .gauge{display:none}
.stage.expanded .cam:not(.is-focus) .detect{grid-template-columns:1fr;padding:10px 12px}
.stage.expanded .cam:not(.is-focus) .feed-head{padding:7px 10px}
.stage.expanded .cam:not(.is-focus) .tag{font-size:12px}
.stage.expanded .cam:not(.is-focus) .tag .sep,
.stage.expanded .cam:not(.is-focus) .tag .zone{display:none}
.screen{cursor:zoom-in}
.screen:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stage.expanded .cam.is-focus .screen{cursor:zoom-out}
.back{
  display:none;cursor:pointer;flex:none;
  align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink);
  background:var(--raised);border:1px solid var(--line-2);border-radius:8px;padding:4px 10px;
}
.back:hover{background:var(--hover)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage.expanded .cam.is-focus .back{display:inline-flex}

.side{
  display:flex;flex-direction:column;min-height:0;gap:16px;
  padding:20px 20px 0 0;
}

/* ── Tarjeta de cámara ──────────────────────────────────── */
.feed{
  flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;transition:border-color .25s,box-shadow .25s;
}
.feed.is-alert{
  border-color:var(--alert);
  box-shadow:0 0 0 1px var(--alert),0 0 40px -10px rgba(238,90,82,.55);
  animation:ring 1.6s ease-in-out infinite;
}
@keyframes ring{
  50%{box-shadow:0 0 0 1px var(--alert),0 0 56px -6px rgba(238,90,82,.7)}
}
.screen{flex:1;min-height:200px;position:relative;background:#030507;display:flex}
/* El video se ve completo, en su proporción, sin recorte */
.screen canvas{width:100%;height:100%;display:block;object-fit:contain}

/* Barra de la cámara: va arriba del video, no encima, para no tapar
   el HUD que el pipeline pinta en el propio cuadro. */
.feed-head{
  flex:none;display:flex;align-items:center;gap:10px;min-width:0;
  padding:9px 12px 9px 14px;border-bottom:1px solid var(--line);
}
.tag{
  display:inline-flex;align-items:center;gap:8px;min-width:0;
  font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
}
.tag .cam-name{color:var(--ink);font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.tag .sep{width:1px;height:12px;background:var(--line-2);flex:none}
.feed-head .right{margin-left:auto;flex:none}
.tag .metric{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.tag .metric b{color:var(--ink);font-weight:500}

/* ── Estado de detección (pie de la tarjeta) ────────────── */
.detect{
  flex:none;border-top:1px solid var(--line);padding:14px 16px;
  display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;
}
.state-chip{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:600;
  padding:6px 12px 6px 10px;border-radius:999px;white-space:nowrap;
  background:var(--ok-soft);color:var(--ok);
}
.state-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.state-chip.sin-datos{background:var(--raised);color:var(--ink-3)}
.state-chip.evaluando{background:var(--warn-soft);color:var(--warn)}
.state-chip.alerta{background:var(--alert-soft);color:var(--alert)}
.state-chip.alerta::before{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{opacity:.25}}
.gauge{display:flex;flex-direction:column;gap:7px;min-width:0}
.gauge-top{display:flex;align-items:baseline;gap:10px}
.gauge-top .lbl{font-size:12.5px;color:var(--ink-2)}
.gauge-top .val{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.ticks{display:flex;gap:3px}
.ticks:empty{display:none}
.tick{flex:1;height:6px;border-radius:999px;background:var(--raised);transition:background .12s}
.tick.on{background:var(--warn)}
.tick.full{background:var(--alert)}

/* ── Barra lateral ──────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;
}
.stat .n{font-family:var(--font-mono);font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.stat.quiet .n{color:var(--ink-2)}
.stat.live .n{color:var(--accent)}
.stat.hot{border-color:rgba(238,90,82,.35);background:linear-gradient(180deg,var(--alert-soft),var(--surface))}
.stat.hot .n{color:var(--alert)}

.panel{
  flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius) var(--radius) 0 0;border-bottom:none;
}
.tabs{
  display:flex;gap:4px;flex:none;margin:10px;padding:4px;
  background:var(--bg);border-radius:10px;
}
.tab{
  flex:1;appearance:none;background:none;border:none;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--ink-3);
  padding:7px 12px;border-radius:7px;transition:background .15s,color .15s;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.log{flex:1;min-height:0;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
.ev{
  position:relative;border-radius:10px;padding:11px 12px 11px 28px;
  background:transparent;border:1px solid transparent;transition:background .15s;
}
.ev:hover{background:var(--raised)}
.ev::before{
  content:"";position:absolute;left:12px;top:17px;
  width:7px;height:7px;border-radius:50%;background:var(--ink-3);
}
.ev.sev-1::before{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.ev.sev-2{background:var(--alert-soft);border-color:rgba(238,90,82,.25)}
.ev.sev-2::before{background:var(--alert);box-shadow:0 0 0 3px var(--alert-soft)}
/* Atendidas: una sola línea, atenuada, debajo de las pendientes */
.ev.acked{
  padding:6px 12px 6px 28px;color:var(--ink-3);cursor:pointer;
  background:transparent;border-color:transparent;
}
.ev.acked:hover{background:var(--raised);color:var(--ink-2)}
.ev.acked::before{
  content:"✓";top:6px;left:11px;width:auto;height:auto;border-radius:0;
  background:none;box-shadow:none;font-size:11px;color:var(--ok);
}
.ev.acked .ev-head{gap:8px;min-width:0}
.ev.acked .ev-type{font-size:12.5px;font-weight:500;color:inherit}
.ev.acked .ev-where{margin:0;font-size:12px;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev.acked .ev-time{font-size:11.5px;flex:none}
.ev-group{
  display:flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:500;color:var(--ink-3);margin:8px 4px 2px;
}
.ev-group:first-child{margin-top:0}
.ev-group::after{content:"";flex:1;height:1px;background:var(--line)}
.ev-head{display:flex;align-items:baseline;gap:10px}
.ev-type{font-weight:600;font-size:13.5px}
.ev-time{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev-where{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.ev-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.ev-meta span{
  font-family:var(--font-mono);font-size:11px;color:var(--ink-2);
  background:var(--bg);border-radius:6px;padding:2px 7px;
}
.ev-shot{display:block;width:100%;margin-top:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.ev-foot{display:flex;align-items:center;gap:8px;margin-top:9px}
.view-cam{
  appearance:none;cursor:pointer;font-size:12px;font-weight:500;
  background:transparent;color:var(--accent);
  border:1px solid rgba(76,194,211,.35);border-radius:8px;padding:5px 11px;
}
.view-cam:hover{background:var(--accent-soft)}
.view-cam:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view-cam[disabled]{color:var(--ink-3);border-color:var(--line);cursor:default;background:transparent}
.ack{
  appearance:none;cursor:pointer;font-size:12px;font-weight:500;
  background:var(--accent);color:#04191C;
  border:none;border-radius:8px;padding:6px 12px;transition:filter .15s;
}
.ack:hover{filter:brightness(1.1)}
.ack:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ack[disabled]{color:var(--ink-3);background:transparent;padding-left:0;cursor:default;filter:none}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;height:100%;min-height:180px;color:var(--ink-3);text-align:center;padding:24px;
}
.empty .big{font-size:14px;color:var(--ink-2);font-weight:500}
.empty .small{font-size:12.5px}
.stage > .empty{
  grid-column:1/-1;border:1px dashed var(--line-2);border-radius:var(--radius);
}

/* ── Acciones ───────────────────────────────────────────── */
.actions{flex:1;min-height:0;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
.action{
  appearance:none;cursor:pointer;width:100%;text-align:left;
  display:flex;align-items:center;gap:12px;
  font-size:13.5px;color:var(--ink);
  background:transparent;border:1px solid transparent;border-radius:10px;padding:10px 12px;
  transition:background .15s,border-color .15s;
}
.action .ic{
  width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
}
.action:hover{background:var(--raised);border-color:var(--line)}
.action:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.actions .eyebrow{font-size:11.5px;color:var(--ink-3);font-weight:500;margin:12px 12px 2px}

/* ── Aviso flotante ─────────────────────────────────────── */
.toast{
  position:fixed;right:24px;bottom:24px;z-index:90;max-width:340px;
  background:var(--raised);border:1px solid var(--line-2);border-radius:12px;
  padding:12px 16px;font-size:13px;color:var(--ink);white-space:pre-line;
  box-shadow:0 12px 32px -8px rgba(0,0,0,.6);
  transition:opacity .2s,transform .2s;
}
.toast.off{opacity:0;transform:translateY(8px);pointer-events:none}

/* ── Token modal ────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(3,5,7,.7);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
}
.modal{
  background:var(--surface);border:1px solid var(--line-2);border-radius:16px;
  padding:28px;width:380px;max-width:100%;box-shadow:0 24px 64px -16px rgba(0,0,0,.7);
}
.modal .logo{margin-bottom:16px}
.modal h2{font-size:17px;font-weight:600;margin:0 0 6px}
.modal p{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.modal input{
  width:100%;background:var(--bg);border:1px solid var(--line-2);color:var(--ink);
  font-family:var(--font-mono);font-size:13px;padding:11px 13px;border-radius:10px;margin-bottom:12px;
}
.modal input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.modal button{
  width:100%;padding:11px;background:var(--accent);color:#04191C;border:none;
  border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;
}
.modal button:hover{filter:brightness(1.1)}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px;border:2px solid transparent;background-clip:padding-box}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  body{overflow:auto}
  .top{height:auto;min-height:60px;padding:10px 16px;flex-wrap:wrap}
  .body{grid-template-columns:1fr}
  .side{padding:0 16px 16px}
  .panel{border-radius:var(--radius);border-bottom:1px solid var(--line)}
  .stage{grid-template-columns:1fr;grid-auto-rows:auto;padding:16px;overflow:visible}
  .screen{min-height:0;aspect-ratio:4/3;flex:none}
  .detect{grid-template-columns:1fr;gap:12px}
  .log{max-height:420px}
  .feed-head .right{display:none}
  .stage.expanded{grid-template-columns:1fr}
  .stage.expanded .cam.is-focus{grid-column:auto;grid-row:auto;order:-1}
  .stage.expanded .cam:not(.is-focus){grid-column:auto}
}
</style>
</head>
<body>

<!-- Token modal: oculto al cargar; init() lo muestra solo si el servidor responde 401 -->
<div class="modal-overlay hidden" id="tokenModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tokenTitle">
    <div class="logo">
      <svg width="16" height="18" viewBox="0 0 22 26" fill="none" aria-hidden="true">
        <path d="M11 1 1 5v8c0 6 4.3 10.6 10 12 5.7-1.4 10-6 10-12V5L11 1Z" stroke="currentColor" stroke-width="2"/>
        <circle cx="11" cy="11" r="3" stroke="currentColor" stroke-width="2"/>
      </svg>
    </div>
    <h2 id="tokenTitle">Autenticación requerida</h2>
    <p>Ingresa el token de acceso del nodo.</p>
    <input type="password" id="tokenInput" placeholder="Token de acceso" autocomplete="off"
           onkeydown="if(event.key==='Enter')saveToken()">
    <button onclick="saveToken()">Ingresar</button>
  </div>
</div>

<div class="toast off" id="toast" role="status" aria-live="polite"></div>

<header class="top">
  <div class="mark">
    <div class="logo">
      <svg width="16" height="18" viewBox="0 0 22 26" fill="none" aria-hidden="true">
        <path d="M11 1 1 5v8c0 6 4.3 10.6 10 12 5.7-1.4 10-6 10-12V5L11 1Z" stroke="currentColor" stroke-width="2"/>
        <circle cx="11" cy="11" r="3" stroke="currentColor" stroke-width="2"/>
      </svg>
    </div>
    <div>
      <b>Vigía Digital</b>
      <span>Panel de operador</span>
    </div>
  </div>
  <div class="top-right">
    <span class="pill"><span class="dot" id="nodeDot"></span> <span id="nodeId">Nodo —</span></span>
    <span class="pill" id="camCount">0 cámaras activas</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>

<div class="body">

  <main class="stage" id="cameraGrid">
    <div class="empty"><div class="big">Conectando con el sistema…</div></div>
  </main>

  <aside class="side">
    <div class="stats">
      <div class="stat live"><div class="n" id="statCams">0</div><div class="k">Cámaras</div></div>
      <div class="stat quiet"><div class="n" id="statEvents">0</div><div class="k">Eventos 1 h</div></div>
      <div class="stat quiet" id="statAlertsBox"><div class="n" id="statAlerts">0</div><div class="k">Alertas</div></div>
    </div>

    <div class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" aria-controls="panelEvents" id="tabEvents" onclick="switchTab('events')">Bitácora</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="panelActions" id="tabActions" onclick="switchTab('actions')">Acciones</button>
      </div>

      <div class="log" id="panelEvents" role="tabpanel" aria-labelledby="tabEvents"></div>

      <div class="actions hidden" id="panelActions" role="tabpanel" aria-labelledby="tabActions">
        <button class="action" onclick="refreshAll()">
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span>
          Actualizar todas las cámaras
        </button>
        <button class="action" onclick="exportShift()">
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
          Exportar turno actual
        </button>
        <button class="action" onclick="window.open('/','_blank')">
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          Abrir auditoría forense
        </button>
        <div class="eyebrow">Sistema</div>
        <button class="action" onclick="checkHealth()">
          <span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
          Verificar salud del sistema
        </button>
      </div>
    </div>
  </aside>

</div>

<script>
// ── Config ──
const BASE    = window.location.origin;
const OP_BASE = BASE + '/operator';
let TOKEN     = sessionStorage.getItem('vd_token') || '';
let wsMap     = {};     // camera_id → WebSocket
let cameras   = {};     // camera_id → state
let alertCount = 0;

// Texto de la API insertado como HTML: se escapa.
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ── Aviso flotante (reemplaza a alert()) ──
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('off');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('off'), 5000);
}

// ── Auth ──
function saveToken() {
  TOKEN = document.getElementById('tokenInput').value.trim();
  sessionStorage.setItem('vd_token', TOKEN);
  document.getElementById('tokenModal').classList.add('hidden');
  init();
}

function headers() {
  return TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {};
}

// ── Init ──
async function init() {
  // El identificador de nodo lo entrega el propio panel (no depende de forensic_api).
  try {
    const r = await fetch(OP_BASE + '/api/node', { headers: headers() });
    if (r.status === 401) { document.getElementById('tokenModal').classList.remove('hidden'); return; }
    if (r.ok) {
      const data = await r.json();
      document.getElementById('nodeId').textContent = 'Nodo ' + (data.node_id || '—');
      document.getElementById('nodeDot').className = 'dot ok';
    }
  } catch(e) {}

  refreshCameras();
  refreshEvents();
  updateClock();
  setInterval(refreshCameras, 5000);
  setInterval(refreshEvents,  3000);
  setInterval(updateClock,    1000);
}

// ── Reloj ──
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-CL', { hour12: false });
}

// ── Cámaras ──
async function refreshCameras() {
  try {
    const r = await fetch(OP_BASE + '/api/cameras/status', { headers: headers() });
    if (!r.ok) return;
    const data = await r.json();
    renderCameras(data.cameras || []);
    const total = data.total || 0;
    document.getElementById('statCams').textContent = total;
    document.getElementById('camCount').textContent =
      total + (total === 1 ? ' cámara activa' : ' cámaras activas');
  } catch(e) {}
}

function renderCameras(list) {
  const grid = document.getElementById('cameraGrid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty"><div class="big">Sin cámaras registradas</div>' +
                     '<div class="small">Inicia runner.py para comenzar.</div></div>';
    applyLayout();
    return;
  }
  // Quitar el mensaje provisorio ("Conectando..." / "Sin cámaras...")
  grid.querySelectorAll(':scope > :not(.cam)').forEach(el => el.remove());
  list.forEach(cam => {
    cameras[cam.id] = cam;
    let card = document.getElementById('cam-card-' + cam.id);
    if (!card) {
      card = createCameraCard(cam);
      grid.appendChild(card);
    }
    updateCameraCard(card, cam);
    if (!wsMap[cam.id]) connectWS(cam.id);
  });
  applyLayout();  // por si aparece una cámara nueva con la vista expandida
}

// ── Vista expandida ──
// Solo alterna clases: las tarjetas no se recrean ni se mueven en el DOM,
// de modo que los canvas y sus WebSocket siguen intactos.
let focusedCam = null;   // camera_id expandida, o null en la grilla

function applyLayout() {
  const grid  = document.getElementById('cameraGrid');
  const cards = grid.querySelectorAll(':scope > .cam');
  // Con una sola cámara (o la expandida ya no existe) no hay tira que mostrar.
  if (focusedCam && (cards.length < 2 || !document.getElementById('cam-card-' + focusedCam))) {
    focusedCam = null;
  }
  grid.classList.toggle('expanded', !!focusedCam);
  grid.style.setProperty('--others', Math.max(1, cards.length - 1));
  cards.forEach(c => c.classList.toggle('is-focus', c.id === 'cam-card-' + focusedCam));
}

function expandCamera(cameraId) {
  focusedCam = cameraId;
  applyLayout();
}

function collapseCameras() {
  focusedCam = null;
  applyLayout();
}

// Clic en una cámara: la expande; clic en la expandida: vuelve a la grilla.
function toggleCamera(cameraId) {
  if (focusedCam === cameraId) collapseCameras();
  else expandCamera(cameraId);
}

function cameraIdOf(el) {
  const card = el.closest('.cam');
  return card ? card.id.slice('cam-card-'.length) : null;
}

document.getElementById('cameraGrid').addEventListener('click', (e) => {
  if (e.target.closest('[data-role="back"]')) { collapseCameras(); return; }
  const screen = e.target.closest('.screen');
  if (screen) toggleCamera(cameraIdOf(screen));
});

document.getElementById('cameraGrid').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (!e.target.classList.contains('screen')) return;
  e.preventDefault();
  toggleCamera(cameraIdOf(e.target));
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !focusedCam) return;
  // Esc en el modal del token no debe tocar la vista de cámaras.
  if (!document.getElementById('tokenModal').classList.contains('hidden')) return;
  collapseCameras();
});

function createCameraCard(cam) {
  const card = document.createElement('div');
  card.className = 'cam';
  card.id = 'cam-card-' + cam.id;
  card.innerHTML = `
    <section class="feed" id="feed-${esc(cam.id)}">
      <div class="feed-head">
        <span class="tag">
          <span class="dot" id="dot-${esc(cam.id)}"></span>
          <span class="cam-name" title="${esc(cam.id)}">${esc(cam.name || cam.id)}</span>
          <span class="sep"></span>
          <span class="zone">${esc(cam.zone || cam.id)}</span>
        </span>
        <span class="tag right">
          <span id="status-${esc(cam.id)}">${esc(statusLabel(cam.status))}</span>
          <span class="sep"></span>
          <span class="metric"><b id="fps-${esc(cam.id)}">--</b> fps</span>
        </span>
        <button class="back" type="button" data-role="back">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          Volver
        </button>
      </div>
      <div class="screen" tabindex="0" role="button"
           aria-label="Expandir o reducir ${esc(cam.name || cam.id)}">
        <canvas id="canvas-${esc(cam.id)}"></canvas>
      </div>
      <div class="detect" id="detect-${esc(cam.id)}" aria-live="polite">
        <span class="state-chip sin-datos" data-role="chip">Sin datos</span>
        <div class="gauge" data-role="gauge">
          <div class="gauge-top">
            <span class="lbl">Confirmación temporal</span>
            <span class="val hidden" data-role="val"></span>
          </div>
          <div class="ticks" data-role="ticks" aria-hidden="true"></div>
        </div>
      </div>
    </section>`;
  return card;
}

function updateCameraCard(card, cam) {
  const dot = document.getElementById('dot-' + cam.id);
  const fps = document.getElementById('fps-' + cam.id);
  const st  = document.getElementById('status-' + cam.id);
  const feed = document.getElementById('feed-' + cam.id);
  // alert_active: evento reciente (unos segundos) sin Ack. No usa el acumulado.
  if (dot) dot.className = 'dot ' + (cam.status === 'offline' ? 'alert' : cam.alert_active ? 'warn' : cam.status === 'online' ? 'ok' : '');
  if (fps) fps.textContent = cam.fps || 0;
  if (st)  st.textContent = statusLabel(cam.status);
  if (feed) feed.classList.toggle('is-alert', !!cam.alert_active);
}

// ── Franja de estado de detección ──
// status: {metodo, ventana, avance, confirmada} del mismo cuadro que se pinta,
// o null cuando no hay datos (sin conexión o módulo distinto de caídas).
function renderDetection(cameraId, status) {
  const box = document.getElementById('detect-' + cameraId);
  if (!box) return;
  const chip   = box.querySelector('[data-role="chip"]');
  const gauge  = box.querySelector('[data-role="gauge"]');
  const val    = box.querySelector('[data-role="val"]');
  const ticks  = box.querySelector('[data-role="ticks"]');

  if (!status) {
    chip.className = 'state-chip sin-datos';
    chip.textContent = 'Sin datos';
    gauge.className = 'gauge';
    val.classList.add('hidden');
    ticks.innerHTML = '';
    return;
  }

  const done = !!status.confirmada;

  // Criterio bbox: decisión instantánea, sin ventana; solo se muestra el chip.
  if (status.metodo === 'bbox' || !status.ventana) {
    chip.className = 'state-chip' + (done ? ' alerta' : '');
    chip.textContent = done ? 'Caída detectada' : 'Sin incidencias';
    gauge.className = 'gauge hidden';
    ticks.innerHTML = '';
    return;
  }
  gauge.className = 'gauge';

  const N = status.ventana;
  const n = Math.max(0, Math.min(N, status.avance || 0));
  if (ticks.children.length !== N) {
    ticks.innerHTML = '';
    for (let i = 0; i < N; i++) {
      const d = document.createElement('span');
      d.className = 'tick';
      ticks.appendChild(d);
    }
  }
  for (let i = 0; i < N; i++) {
    ticks.children[i].className = 'tick' + (i < n ? (done ? ' full' : ' on') : '');
  }
  val.textContent = n + ' / ' + N + ' cuadros';
  val.classList.remove('hidden');
  chip.className = 'state-chip ' + (done ? 'alerta' : n ? 'evaluando' : '');
  chip.textContent = done ? 'Caída confirmada' : n ? 'Evaluando postura' : 'Sin incidencias';
}

// ── WebSocket feeds ──
// Cada cuadro binario puede venir precedido de un texto JSON con su estado
// de detección. El estado se guarda y se aplica al pintar ese cuadro.
function connectWS(cameraId) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${proto}//${location.host}/operator/ws/live/${cameraId}?token=${TOKEN}`;
  const ws    = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  let pendingStatus = null;

  ws.onmessage = (evt) => {
    if (typeof evt.data === 'string') {
      try { pendingStatus = JSON.parse(evt.data); } catch(e) { pendingStatus = null; }
      return;
    }
    const status = pendingStatus;
    pendingStatus = null;
    const canvas = document.getElementById('canvas-' + cameraId);
    if (!canvas) return;
    const blob = new Blob([evt.data], { type: 'image/jpeg' });
    const url  = URL.createObjectURL(blob);
    const img  = new Image();
    img.onload = () => {
      canvas.width  = img.width;
      canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      renderDetection(cameraId, status);
    };
    img.src = url;
  };

  ws.onclose = () => {
    delete wsMap[cameraId];
    renderDetection(cameraId, null);
    setTimeout(() => connectWS(cameraId), 3000);
  };

  wsMap[cameraId] = ws;
}

// ── Eventos / Bitácora ──
async function refreshEvents() {
  try {
    const r = await fetch(OP_BASE + '/api/events/recent?minutes=60', { headers: headers() });
    if (!r.ok) return;
    const data = await r.json();
    renderEvents(data.events || []);
    document.getElementById('statEvents').textContent = data.total || 0;
  } catch(e) {}
}

function formatSeconds(s) {
  // Un episodio de un solo cuadro dura ~0,03 s: redondeado diría "0,0 s".
  if (Number(s) < 0.1) return 'menos de 0,1 s';
  return Number(s).toLocaleString('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' s';
}

// Nombre de la cámara (del config, vía /api/cameras/status) y zona del evento.
function eventWhere(evt) {
  const cam = cameras[evt.camera_id] || {};
  const name = cam.name || evt.camera_id || '—';
  const zone = evt.zone || cam.zone;
  return zone ? name + ' · ' + zone : name;
}

function renderEvents(events) {
  const panel = document.getElementById('panelEvents');
  const alertsThisHour = events.filter(e => (e.alert_level || 1) >= 2).length;
  document.getElementById('statAlerts').textContent = alertsThisHour;
  document.getElementById('statAlertsBox').className = 'stat ' + (alertsThisHour ? 'hot' : 'quiet');

  panel.innerHTML = '';
  if (!events.length) {
    panel.innerHTML = '<div class="empty"><div class="big">Sin eventos en la última hora</div>' +
                      '<div class="small">Las detecciones aparecerán aquí.</div></div>';
    return;
  }
  // La API entrega los eventos del más reciente al más antiguo. Se separan en
  // pendientes (arriba, completas) y atendidas (abajo, en una sola línea),
  // conservando dentro de cada grupo el orden por recencia.
  const pending = events.filter(e => !e.acknowledged);
  const done    = events.filter(e => e.acknowledged);
  const group = (text) => {
    const g = document.createElement('div');
    g.className = 'ev-group';
    g.textContent = text;
    panel.appendChild(g);
  };
  if (pending.length) group('Pendientes · ' + pending.length);
  pending.forEach(evt => panel.appendChild(eventCard(evt)));
  if (done.length) group('Atendidas · ' + done.length);
  done.forEach(evt => panel.appendChild(eventRow(evt)));
}

// Nombres en español para lo que la API entrega en inglés.
const EVENT_LABELS = {
  fall: 'Caída',
  'caída': 'Caída',
  perimeter_breach: 'Intrusión de perímetro',
  after_hours_motion: 'Movimiento fuera de horario',
  vehicle_entry: 'Ingreso de vehículo',
  zone_occupancy: 'Ocupación de zona',
  pool_occupancy: 'Ocupación de piscina',
  thermal_alert: 'Alerta térmica',
  weapon_detected: 'Arma detectada',
  manual_alert: 'Alerta manual',
};
// Un tipo sin traducción se muestra como "Evento", nunca en inglés.
function eventLabel(type) {
  return EVENT_LABELS[String(type || '').toLowerCase()] || 'Evento';
}

const STATUS_LABELS = { online: 'En línea', offline: 'Sin conexión' };
function statusLabel(status) {
  return STATUS_LABELS[status || 'online'] || status;
}

function eventTime(evt) {
  return evt.timestamp ? new Date(evt.timestamp * 1000).toLocaleTimeString('es-CL') : '--:--';
}

// Atendida: una línea (tipo, cámara, hora). Clic en ella expande la cámara.
function eventRow(evt) {
  const item = document.createElement('article');
  item.className = 'ev acked';
  item.id = 'evt-' + evt.id;
  if (document.getElementById('cam-card-' + evt.camera_id)) {
    item.dataset.cam = evt.camera_id;
    item.title = 'Ver cámara';
  }
  const cam = cameras[evt.camera_id] || {};
  item.innerHTML = `
    <div class="ev-head">
      <span class="ev-type">${esc(eventLabel(evt.event_type))}</span>
      <span class="ev-where">${esc(cam.name || evt.camera_id || '—')}</span>
      <span class="ev-time">${esc(eventTime(evt))}</span>
    </div>`;
  return item;
}

// Pendiente: tarjeta completa con "Ver cámara" y "Confirmar atención".
function eventCard(evt) {
  const item = document.createElement('article');
  const level = evt.alert_level || 1;
  const sev = level >= 3 ? ' sev-2' : level === 2 ? ' sev-1' : '';
  item.className = 'ev' + sev;
  item.id = 'evt-' + evt.id;
  const metaParts = [];
  if (evt.duration_seconds != null) metaParts.push(`<span>duración ${esc(formatSeconds(evt.duration_seconds))}</span>`);
  // Estado del correo: lo agrega demo_camara_ip.py cuando termina el envío.
  if (evt.correo) metaParts.push(`<span>📧 ${esc(evt.correo)}</span>`);
  const duration = metaParts.length ? `<div class="ev-meta">${metaParts.join('')}</div>` : '';
  // Captura del momento de la caída: la anota demo_panel.py --correo junto
  // con el estado del correo.
  const shot = evt.captura ? '<img class="ev-shot" alt="Captura del momento de la caída">' : '';
  item.innerHTML = `
    <div class="ev-head">
      <span class="ev-type">${esc(eventLabel(evt.event_type))}</span>
      <span class="ev-time">${esc(eventTime(evt))}</span>
    </div>
    <div class="ev-where" title="${esc(evt.camera_id || '')}">${esc(eventWhere(evt))}</div>
    ${duration}
    ${shot}
    <div class="ev-foot">
      <button class="view-cam" type="button" data-cam="${esc(evt.camera_id || '')}"
        ${document.getElementById('cam-card-' + evt.camera_id) ? '' : 'disabled title="Cámara no disponible en este panel"'}>Ver cámara</button>
      <button class="ack" onclick="ackEvent('${esc(evt.id)}',this)">Confirmar atención</button>
    </div>`;
  if (shot) loadCapture(item.querySelector('.ev-shot'), evt.id);
  return item;
}

// La bitácora se redibuja cada 3 s: la captura se descarga una vez por evento
// y se reutiliza. Va por fetch (no por src) para enviar el token si lo hay.
const captureUrls = {};   // event id → Promise<object URL>
function loadCapture(img, eventId) {
  if (!captureUrls[eventId]) {
    captureUrls[eventId] = fetch(OP_BASE + '/api/events/' + encodeURIComponent(eventId) + '/captura',
                                 { headers: headers() })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(b => URL.createObjectURL(b))
      .catch(() => { delete captureUrls[eventId]; return null; });
  }
  captureUrls[eventId].then(url => { if (url) img.src = url; else img.remove(); });
}

// "Ver cámara" (botón o fila atendida): el id va en data-cam, no en un onclick,
// para no interpolarlo en JS.
document.getElementById('panelEvents').addEventListener('click', (e) => {
  const btn = e.target.closest('.view-cam, .ev.acked[data-cam]');
  if (btn && !btn.disabled && btn.dataset.cam) expandCamera(btn.dataset.cam);
});

async function ackEvent(eventId, btn) {
  try {
    const r = await fetch(OP_BASE + '/api/events/' + eventId + '/acknowledge', {
      method: 'POST', headers: headers()
    });
    if (r.ok) {
      btn.disabled = true;
      refreshEvents();   // pasa a "Atendidas" de inmediato, sin esperar el ciclo
      refreshCameras();  // apagar el borde sin esperar el siguiente ciclo
    }
  } catch(e) {}
}

// ── Acciones ──
function switchTab(tab) {
  document.getElementById('panelEvents').classList.toggle('hidden', tab !== 'events');
  document.getElementById('panelActions').classList.toggle('hidden', tab !== 'actions');
  document.getElementById('tabEvents').setAttribute('aria-selected', tab === 'events');
  document.getElementById('tabActions').setAttribute('aria-selected', tab === 'actions');
}

function refreshAll() { refreshCameras(); refreshEvents(); toast('Cámaras y bitácora actualizadas.'); }

async function exportShift() {
  try {
    const r = await fetch(OP_BASE + '/api/shift/export', { method: 'POST', headers: headers() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const blob = new Blob([JSON.stringify(data.shift_report, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'turno_' + new Date().toISOString().slice(0,16).replace('T','_') + '.json';
    a.click();
  } catch(e) {
    toast('No se pudo exportar el turno.');
  }
}

async function checkHealth() {
  try {
    const r = await fetch(BASE + '/api/v1/health', { headers: headers() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    toast('Estado: ' + d.status + '\nDetecciones: ' + d.total_detections + '\nBD: ' + d.db_mode);
  } catch(e) {
    toast('Salud del sistema no disponible en este nodo (requiere la API forense).');
  }
}

// ── Start ──
// Se intenta con el token guardado (o sin token). Si el servidor exige
// autenticación, init() recibe 401 y muestra el modal.
init();
</script>
</body>
</html>
