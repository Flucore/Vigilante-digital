<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía Digital — Panel de Operador</title>
<style>
/* Fuentes servidas por el propio panel (/operator/fonts, licencia OFL en
   OFL.txt): la UI no hace ninguna petición a internet. */
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:700;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("/operator/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url("/operator/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url("/operator/fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2")}

/* Panel de operación nocturna: video protagonista + barra lateral de estado y bitácora.
   Tema único oscuro por decisión: se usa en salas con poca luz durante el turno de noche. */
:root{
  --bg:#0B1016;
  --surface:#141C24;
  --raised:#1B252F;
  --line:#26323D;
  --ink:#E8EEF3;
  --ink-2:#8FA3B3;
  --ink-3:#5C6F7E;
  --accent:#46B8C9;
  --ok:#4EA86B;
  --warn:#D99A3E;
  --alert:#D9544D;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);font-size:15px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
}
.hidden{display:none !important}

/* ── Encabezado ─────────────────────────────────────────── */
.top{
  display:flex;align-items:center;gap:16px;
  padding:0 20px;height:56px;flex:none;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.mark{display:flex;align-items:center;gap:11px;min-width:0}
.mark svg{flex:none}
.mark b{font-size:15px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.mark span{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-top:-2px;
}
.top-right{margin-left:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pill{
  display:flex;align-items:center;gap:7px;
  font-family:var(--font-mono);font-size:12px;color:var(--ink-2);
  background:var(--raised);border:1px solid var(--line);
  padding:5px 11px;border-radius:999px;white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.alert{background:var(--alert)}
.clock{font-family:var(--font-mono);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ── Cuerpo ─────────────────────────────────────────────── */
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
/* Una columna por cámara; con una sola, ocupa todo el escenario */
.stage{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
  grid-auto-rows:minmax(0,1fr);
  min-width:0;min-height:0;padding:16px;gap:16px;overflow-y:auto;
}
.cam{display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.side{
  display:flex;flex-direction:column;min-height:0;
  border-left:1px solid var(--line);background:var(--surface);
}

/* ── Video ──────────────────────────────────────────────── */
.feed{
  flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  transition:border-color .25s,box-shadow .25s;
}
.feed.is-alert{border-color:var(--alert);box-shadow:0 0 0 1px var(--alert),0 0 28px -12px var(--alert)}
.screen{flex:1;min-height:200px;position:relative;background:#05080B;display:flex}
/* El video se ve completo, en su proporción, sin recorte */
.screen canvas{width:100%;height:100%;display:block;object-fit:contain}
.feed-foot{
  flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 16px;border-top:1px solid var(--line);background:var(--raised);
}
.cam-name{font-weight:600;font-size:14.5px}
.cam-where{color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:7px}
.foot-sep{width:1px;height:16px;background:var(--line)}
.foot-right{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.metric{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.metric b{color:var(--ink);font-weight:500}

/* ── Estado de detección ────────────────────────────────── */
.detect{
  flex:none;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:14px 16px;
  display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
}
.state-chip{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:12px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;
  padding:6px 12px;border-radius:6px;white-space:nowrap;
  background:rgba(78,168,107,.14);color:var(--ok);border:1px solid rgba(78,168,107,.3);
}
.state-chip.sin-datos{background:var(--raised);color:var(--ink-3);border-color:var(--line)}
.state-chip.evaluando{background:rgba(217,154,62,.14);color:var(--warn);border-color:rgba(217,154,62,.32)}
.state-chip.alerta{background:rgba(217,84,77,.16);color:var(--alert);border-color:rgba(217,84,77,.36)}
.gauge{display:flex;flex-direction:column;gap:7px;min-width:0}
.gauge-top{display:flex;align-items:baseline;gap:10px}
.gauge-top .lbl{font-size:12.5px;color:var(--ink-2)}
.gauge-top .val{margin-left:auto;font-family:var(--font-mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.ticks{display:flex;gap:4px}
.tick{flex:1;height:7px;border-radius:2px;background:var(--line);transition:background .12s}
.tick.on{background:var(--warn)}
.tick.full{background:var(--alert)}
.instant{font-size:12.5px;color:var(--ink-2)}
.method{text-align:right;white-space:nowrap}
.method .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block}
.method .v{font-family:var(--font-mono);font-size:13px;color:var(--accent)}

/* ── Barra lateral ──────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);flex:none}
.stat{padding:14px 12px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .n{font-family:var(--font-mono);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.stat.quiet .n{color:var(--ink-3)}
.stat.live .n{color:var(--accent)}
.stat.hot .n{color:var(--alert)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);flex:none;padding:0 6px}
.tab{
  appearance:none;background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:var(--ink-3);
  padding:11px 14px;border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}

.log{flex:1;min-height:0;overflow-y:auto;padding:10px}
.ev{
  position:relative;background:var(--raised);border:1px solid var(--line);
  border-left:3px solid var(--ink-3);border-radius:8px;
  padding:11px 13px;margin-bottom:8px;
}
.ev.sev-2{border-left-color:var(--alert)}
.ev.sev-1{border-left-color:var(--warn)}
.ev.acked{opacity:.55}
.ev-head{display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
.ev-type{font-weight:600;font-size:13.5px}
.ev-time{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ev-where{font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.ev-meta{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3)}
.ev-foot{display:flex;align-items:center;gap:10px;margin-top:9px}
.ack{
  appearance:none;cursor:pointer;font-family:inherit;font-size:11.5px;
  background:transparent;color:var(--accent);
  border:1px solid rgba(70,184,201,.35);border-radius:6px;padding:4px 11px;
}
.ack:hover{background:rgba(70,184,201,.1)}
.ack:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ack[disabled]{color:var(--ink-3);border-color:var(--line);cursor:default;background:transparent}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;height:100%;min-height:180px;color:var(--ink-3);text-align:center;padding:24px;
}
.empty .big{font-size:13.5px;color:var(--ink-2)}
.empty .small{font-size:12px}

/* ── Acciones ───────────────────────────────────────────── */
.actions{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.action{
  appearance:none;cursor:pointer;width:100%;text-align:left;
  display:flex;align-items:center;gap:10px;
  font-family:inherit;font-size:13px;color:var(--ink);
  background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 13px;
}
.action svg{color:var(--accent);flex:none}
.action:hover{border-color:rgba(70,184,201,.45)}
.action:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions .eyebrow{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin:10px 2px 0;
}

/* ── Token modal ────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(5,8,11,.78);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:380px;max-width:100%}
.modal h2{font-size:15px;font-weight:600;margin:0 0 8px}
.modal p{color:var(--ink-2);font-size:13px;margin:0 0 14px}
.modal input{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  font-family:var(--font-mono);font-size:13px;padding:9px 12px;border-radius:6px;margin-bottom:12px;
}
.modal input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.modal button{
  width:100%;padding:9px;background:var(--accent);color:#05080B;border:none;
  border-radius:6px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;
}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  body{overflow:auto}
  .top{height:auto;min-height:56px;padding:10px 16px;flex-wrap:wrap}
  .top-right{gap:10px}
  .body{grid-template-columns:1fr}
  .side{border-left:none;border-top:1px solid var(--line)}
  .stage{grid-template-columns:1fr;grid-auto-rows:auto;padding:16px;overflow:visible}
  .screen{min-height:0;aspect-ratio:4/3;flex:none}
  .detect{grid-template-columns:1fr;gap:12px}
  .method{text-align:left}
  .log{max-height:420px}
}
</style>
</head>
<body>

<!-- Token modal: oculto al cargar; init() lo muestra solo si el servidor responde 401 -->
<div class="modal-overlay hidden" id="tokenModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tokenTitle">
    <h2 id="tokenTitle">Autenticación requerida</h2>
    <p>Ingresa el token de acceso del nodo.</p>
    <input type="password" id="tokenInput" placeholder="Bearer token" autocomplete="off">
    <button onclick="saveToken()">Ingresar</button>
  </div>
</div>

<header class="top">
  <div class="mark">
    <svg width="22" height="26" viewBox="0 0 22 26" fill="none" aria-hidden="true">
      <path d="M11 1 1 5v8c0 6 4.3 10.6 10 12 5.7-1.4 10-6 10-12V5L11 1Z" stroke="#46B8C9" stroke-width="1.6" fill="rgba(70,184,201,.1)"/>
      <circle cx="11" cy="11" r="3" stroke="#46B8C9" stroke-width="1.4"/>
    </svg>
    <div>
      <b>VIGÍA DIGITAL</b>
      <span>Panel de operador</span>
    </div>
  </div>
  <div class="top-right">
    <span class="pill"><span class="dot" id="nodeDot"></span> <span id="nodeId">Nodo —</span></span>
    <span class="pill" id="camCount">0 cámaras activas</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>

<div class="body">

  <main class="stage" id="cameraGrid">
    <div class="empty"><div class="big">Conectando con el sistema…</div></div>
  </main>

  <aside class="side">
    <div class="stats">
      <div class="stat live"><div class="n" id="statCams">0</div><div class="k">Cámaras</div></div>
      <div class="stat quiet"><div class="n" id="statEvents">0</div><div class="k">Eventos 1 h</div></div>
      <div class="stat quiet" id="statAlertsBox"><div class="n" id="statAlerts">0</div><div class="k">Alertas</div></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" aria-controls="panelEvents" id="tabEvents" onclick="switchTab('events')">Bitácora</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="panelActions" id="tabActions" onclick="switchTab('actions')">Acciones</button>
    </div>

    <div class="log" id="panelEvents" role="tabpanel" aria-labelledby="tabEvents"></div>

    <div class="actions hidden" id="panelActions" role="tabpanel" aria-labelledby="tabActions">
      <button class="action" onclick="refreshAll()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Actualizar todas las cámaras
      </button>
      <button class="action" onclick="exportShift()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar turno actual
      </button>
      <button class="action" onclick="window.open('/','_blank')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Abrir auditoría forense
      </button>
      <div class="eyebrow">Sistema</div>
      <button class="action" onclick="checkHealth()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Verificar salud del sistema
      </button>
    </div>
  </aside>

</div>

<script>
// ── Config ──
const BASE    = window.location.origin;
const OP_BASE = BASE + '/operator';
let TOKEN     = sessionStorage.getItem('vd_token') || '';
let wsMap     = {};     // camera_id → WebSocket
let cameras   = {};     // camera_id → state
let alertCount = 0;

// Texto de la API insertado como HTML: se escapa.
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ── Auth ──
function saveToken() {
  TOKEN = document.getElementById('tokenInput').value.trim();
  sessionStorage.setItem('vd_token', TOKEN);
  document.getElementById('tokenModal').classList.add('hidden');
  init();
}

function headers() {
  return TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {};
}

// ── Init ──
async function init() {
  // El identificador de nodo lo entrega el propio panel (no depende de forensic_api).
  try {
    const r = await fetch(OP_BASE + '/api/node', { headers: headers() });
    if (r.status === 401) { document.getElementById('tokenModal').classList.remove('hidden'); return; }
    if (r.ok) {
      const data = await r.json();
      document.getElementById('nodeId').textContent = 'Nodo ' + (data.node_id || '—');
      document.getElementById('nodeDot').className = 'dot ok';
    }
  } catch(e) {}

  refreshCameras();
  refreshEvents();
  updateClock();
  setInterval(refreshCameras, 5000);
  setInterval(refreshEvents,  3000);
  setInterval(updateClock,    1000);
}

// ── Reloj ──
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-CL', { hour12: false });
}

// ── Cámaras ──
async function refreshCameras() {
  try {
    const r = await fetch(OP_BASE + '/api/cameras/status', { headers: headers() });
    if (!r.ok) return;
    const data = await r.json();
    renderCameras(data.cameras || []);
    document.getElementById('statCams').textContent = data.total || 0;
    document.getElementById('camCount').textContent = (data.total || 0) + ' cámaras activas';
  } catch(e) {}
}

function renderCameras(list) {
  const grid = document.getElementById('cameraGrid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty"><div class="big">Sin cámaras registradas</div>' +
                     '<div class="small">Inicia runner.py para comenzar.</div></div>';
    return;
  }
  // Quitar el mensaje provisorio ("Conectando..." / "Sin cámaras...")
  grid.querySelectorAll(':scope > :not(.cam)').forEach(el => el.remove());
  list.forEach(cam => {
    let card = document.getElementById('cam-card-' + cam.id);
    if (!card) {
      card = createCameraCard(cam);
      grid.appendChild(card);
    }
    updateCameraCard(card, cam);
    if (!wsMap[cam.id]) connectWS(cam.id);
  });
}

function createCameraCard(cam) {
  const card = document.createElement('div');
  card.className = 'cam';
  card.id = 'cam-card-' + cam.id;
  card.innerHTML = `
    <section class="feed" id="feed-${esc(cam.id)}">
      <div class="screen"><canvas id="canvas-${esc(cam.id)}"></canvas></div>
      <div class="feed-foot">
        <span class="cam-name">${esc(cam.id)}</span>
        <span class="foot-sep"></span>
        <span class="cam-where"><span class="dot" id="dot-${esc(cam.id)}"></span><span id="status-${esc(cam.id)}">${esc(cam.status || 'online')}</span></span>
        <div class="foot-right">
          <span class="metric"><b id="fps-${esc(cam.id)}">--</b> fps</span>
          <span class="metric" id="res-${esc(cam.id)}">—</span>
        </div>
      </div>
    </section>
    <section class="detect" id="detect-${esc(cam.id)}" aria-live="polite">
      <span class="state-chip sin-datos" data-role="chip">Sin datos</span>
      <div class="gauge" data-role="gauge">
        <div class="gauge-top">
          <span class="lbl">Confirmación temporal</span>
          <span class="val hidden" data-role="val"></span>
        </div>
        <div class="ticks" data-role="ticks" aria-hidden="true"></div>
      </div>
      <div class="method">
        <span class="k">Criterio activo</span>
        <span class="v" data-role="method">—</span>
      </div>
    </section>`;
  return card;
}

function updateCameraCard(card, cam) {
  const dot = document.getElementById('dot-' + cam.id);
  const fps = document.getElementById('fps-' + cam.id);
  const st  = document.getElementById('status-' + cam.id);
  const feed = document.getElementById('feed-' + cam.id);
  // alert_active: evento reciente (unos segundos) sin Ack. No usa el acumulado.
  if (dot) dot.className = 'dot ' + (cam.status === 'offline' ? 'alert' : cam.alert_active ? 'warn' : cam.status === 'online' ? 'ok' : '');
  if (fps) fps.textContent = cam.fps || 0;
  if (st)  st.textContent = cam.status || 'online';
  if (feed) feed.classList.toggle('is-alert', !!cam.alert_active);
}

// ── Franja de estado de detección ──
// status: {metodo, ventana, avance, confirmada} del mismo cuadro que se pinta,
// o null cuando no hay datos (sin conexión o módulo distinto de caídas).
function renderDetection(cameraId, status) {
  const box = document.getElementById('detect-' + cameraId);
  if (!box) return;
  const chip   = box.querySelector('[data-role="chip"]');
  const gauge  = box.querySelector('[data-role="gauge"]');
  const val    = box.querySelector('[data-role="val"]');
  const ticks  = box.querySelector('[data-role="ticks"]');
  const method = box.querySelector('[data-role="method"]');
  const lbl    = gauge.querySelector('.lbl');

  if (!status) {
    chip.className = 'state-chip sin-datos';
    chip.textContent = 'Sin datos';
    gauge.className = 'gauge';
    lbl.textContent = 'Confirmación temporal';
    lbl.className = 'lbl';
    val.classList.add('hidden');
    ticks.innerHTML = '';
    method.textContent = '—';
    return;
  }

  const done = !!status.confirmada;

  // Criterio bbox: decisión instantánea, sin ventana ni medidor.
  if (status.metodo === 'bbox' || !status.ventana) {
    chip.className = 'state-chip' + (done ? ' alerta' : '');
    chip.textContent = done ? 'Caída detectada' : 'Sin incidencias';
    lbl.textContent = 'Criterio instantáneo';
    lbl.className = 'instant';
    val.classList.add('hidden');
    ticks.innerHTML = '';
    method.textContent = 'bbox';
    return;
  }

  const N = status.ventana;
  const n = Math.max(0, Math.min(N, status.avance || 0));
  if (ticks.children.length !== N) {
    ticks.innerHTML = '';
    for (let i = 0; i < N; i++) {
      const d = document.createElement('span');
      d.className = 'tick';
      ticks.appendChild(d);
    }
  }
  for (let i = 0; i < N; i++) {
    ticks.children[i].className = 'tick' + (i < n ? (done ? ' full' : ' on') : '');
  }
  lbl.textContent = 'Confirmación temporal';
  lbl.className = 'lbl';
  val.textContent = n + ' / ' + N + ' cuadros';
  val.classList.remove('hidden');
  chip.className = 'state-chip ' + (done ? 'alerta' : n ? 'evaluando' : '');
  chip.textContent = done ? 'Caída confirmada' : n ? 'Evaluando postura' : 'Sin incidencias';
  method.textContent = 'pose · ventana ' + N;
}

// ── WebSocket feeds ──
// Cada cuadro binario puede venir precedido de un texto JSON con su estado
// de detección. El estado se guarda y se aplica al pintar ese cuadro.
function connectWS(cameraId) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${proto}//${location.host}/operator/ws/live/${cameraId}?token=${TOKEN}`;
  const ws    = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  let pendingStatus = null;

  ws.onmessage = (evt) => {
    if (typeof evt.data === 'string') {
      try { pendingStatus = JSON.parse(evt.data); } catch(e) { pendingStatus = null; }
      return;
    }
    const status = pendingStatus;
    pendingStatus = null;
    const canvas = document.getElementById('canvas-' + cameraId);
    if (!canvas) return;
    const blob = new Blob([evt.data], { type: 'image/jpeg' });
    const url  = URL.createObjectURL(blob);
    const img  = new Image();
    img.onload = () => {
      if (canvas.width !== img.width || canvas.height !== img.height) {
        const res = document.getElementById('res-' + cameraId);
        if (res) res.textContent = img.width + '×' + img.height;
      }
      canvas.width  = img.width;
      canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      renderDetection(cameraId, status);
    };
    img.src = url;
  };

  ws.onclose = () => {
    delete wsMap[cameraId];
    renderDetection(cameraId, null);
    setTimeout(() => connectWS(cameraId), 3000);
  };

  wsMap[cameraId] = ws;
}

// ── Eventos / Bitácora ──
async function refreshEvents() {
  try {
    const r = await fetch(OP_BASE + '/api/events/recent?minutes=60', { headers: headers() });
    if (!r.ok) return;
    const data = await r.json();
    renderEvents(data.events || []);
    document.getElementById('statEvents').textContent = data.total || 0;
  } catch(e) {}
}

function formatSeconds(s) {
  return Number(s).toLocaleString('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' s';
}

function renderEvents(events) {
  const panel = document.getElementById('panelEvents');
  const alertsThisHour = events.filter(e => (e.alert_level || 1) >= 2).length;
  document.getElementById('statAlerts').textContent = alertsThisHour;
  document.getElementById('statAlertsBox').className = 'stat ' + (alertsThisHour ? 'hot' : 'quiet');

  panel.innerHTML = '';
  if (!events.length) {
    panel.innerHTML = '<div class="empty"><div class="big">Sin eventos en la última hora</div></div>';
    return;
  }
  // La API entrega los eventos del más reciente al más antiguo.
  events.forEach(evt => {
    const item = document.createElement('article');
    const level = evt.alert_level || 1;
    const sev = level >= 3 ? ' sev-2' : level === 2 ? ' sev-1' : '';
    item.className = 'ev' + sev + (evt.acknowledged ? ' acked' : '');
    item.id = 'evt-' + evt.id;
    const ts = evt.timestamp ? new Date(evt.timestamp * 1000).toLocaleTimeString('es-CL') : '--:--';
    const md = evt.metadata || {};
    const meta = [];
    if (evt.duration_seconds != null) meta.push('duración ' + formatSeconds(evt.duration_seconds));
    if (md.metodo) meta.push('criterio ' + md.metodo + (md.metodo === 'pose' && md.ventana ? ' · ventana ' + md.ventana : ''));
    item.innerHTML = `
      <div class="ev-head">
        <span class="ev-type">${esc(evt.event_type || 'Evento')}</span>
        <span class="ev-time">${esc(ts)}</span>
      </div>
      <div class="ev-where">${esc(evt.camera_id || '—')}</div>
      ${meta.length ? `<div class="ev-meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
      <div class="ev-foot">
        ${!evt.acknowledged
          ? `<button class="ack" onclick="ackEvent('${esc(evt.id)}',this)">Confirmar atención</button>`
          : '<button class="ack" disabled>Revisado</button>'}
      </div>`;
    panel.appendChild(item);
  });
}

async function ackEvent(eventId, btn) {
  try {
    const r = await fetch(OP_BASE + '/api/events/' + eventId + '/acknowledge', {
      method: 'POST', headers: headers()
    });
    if (r.ok) {
      const item = document.getElementById('evt-' + eventId);
      if (item) item.classList.add('acked');
      btn.textContent = 'Revisado';
      btn.disabled = true;
      refreshCameras();  // apagar el borde sin esperar el siguiente ciclo
    }
  } catch(e) {}
}

// ── Acciones ──
function switchTab(tab) {
  document.getElementById('panelEvents').classList.toggle('hidden', tab !== 'events');
  document.getElementById('panelActions').classList.toggle('hidden', tab !== 'actions');
  document.getElementById('tabEvents').setAttribute('aria-selected', tab === 'events');
  document.getElementById('tabActions').setAttribute('aria-selected', tab === 'actions');
}

function refreshAll() { refreshCameras(); refreshEvents(); }

async function exportShift() {
  const r = await fetch(OP_BASE + '/api/shift/export', { method: 'POST', headers: headers() });
  const data = await r.json();
  const blob = new Blob([JSON.stringify(data.shift_report, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'turno_' + new Date().toISOString().slice(0,16).replace('T','_') + '.json';
  a.click();
}

async function checkHealth() {
  try {
    const r = await fetch(BASE + '/api/v1/health', { headers: headers() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    alert('Estado: ' + d.status + '\nDetecciones: ' + d.total_detections + '\nBD: ' + d.db_mode);
  } catch(e) {
    alert('Salud del sistema no disponible en este nodo (requiere la API forense).');
  }
}

// ── Start ──
// Se intenta con el token guardado (o sin token). Si el servidor exige
// autenticación, init() recibe 401 y muestra el modal.
init();
