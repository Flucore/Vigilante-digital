<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigía Digital — Análisis de clips</title>
<style>
/* Mismas fuentes locales y paleta que el panel de operador (operator.html). */
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:700;font-display:swap;src:url("/operator/fonts/ibm-plex-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url("/operator/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
:root{
  --bg:#090C10;--surface:#10151B;--raised:#161D25;--hover:#1C2530;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --ink:#E9EEF2;--ink-2:#97A6B2;--ink-3:#5E6D79;
  --accent:#4CC2D3;--accent-soft:rgba(76,194,211,.12);
  --ok:#4FB872;--ok-soft:rgba(79,184,114,.12);
  --warn:#E2A443;--warn-soft:rgba(226,164,67,.13);
  --alert:#EE5A52;--alert-soft:rgba(238,90,82,.14);
  --radius:14px;
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);
     display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Encabezado */
.top{display:flex;align-items:center;gap:14px;padding:0 24px;height:60px;flex:none;
     border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-weight:700;letter-spacing:.01em}
.brand span{color:var(--accent)}
.sep{width:1px;height:22px;background:var(--line-2)}
.title{color:var(--ink-2);font-weight:500}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
      font-size:12px;font-weight:600;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.real{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.sim{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{border:1px solid var(--line-2);background:var(--raised);color:var(--ink);padding:8px 14px;
     border-radius:10px;font-weight:600;font-size:13px}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:#06232A;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--alert-soft);color:var(--alert);border-color:transparent}
a.link{color:var(--ink-2);font-size:13px;text-decoration:none}
a.link:hover{color:var(--ink)}

/* Cuerpo */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;padding:18px 24px;min-height:0}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.video{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;
       border:1px solid var(--line);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.video img{width:100%;height:100%;object-fit:contain;display:block}
.video .empty{position:absolute;color:var(--ink-3);text-align:center;padding:24px}
.video .empty b{display:block;color:var(--ink-2);font-size:16px;margin-bottom:4px}
.overlay{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;gap:10px;align-items:center;
         background:linear-gradient(rgba(0,0,0,.65),transparent)}
.overlay .cam{font-weight:600}
.overlay .where{color:var(--ink-2)}
.live{color:var(--alert);font-weight:700;font-size:12px;letter-spacing:.08em}
.flash{position:absolute;inset:0;border:4px solid var(--alert);border-radius:var(--radius);
       pointer-events:none;opacity:0;transition:opacity .25s}
.flash.on{opacity:1}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s linear}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{color:var(--ink-3);font-size:12px}
.stat .v{font-size:24px;font-weight:700;margin-top:2px}
.stat .v small{font-size:14px;color:var(--ink-3);font-weight:500}
.note{color:var(--ink-3);font-size:12px}

/* Lista de clips */
.side{display:flex;flex-direction:column;min-height:0;background:var(--surface);
      border:1px solid var(--line);border-radius:var(--radius)}
.side h2{margin:0;padding:14px 16px;font-size:13px;color:var(--ink-2);font-weight:600;
         border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.clip{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.clip.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.clip.fall{border-color:rgba(238,90,82,.55)}
.row{display:flex;align-items:center;gap:8px}
.cid{font-family:var(--mono);color:var(--accent);font-weight:500}
.where2{font-weight:600;flex:1;min-width:0}
.meta{color:var(--ink-3);font-size:12px;margin-top:2px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.exp-c{background:var(--alert-soft);color:var(--alert)}
.tag.exp-n{background:var(--line);color:var(--ink-2)}
.status{margin-top:8px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res{font-weight:600}
.res.ok{color:var(--ok)}.res.bad{color:var(--alert)}.res.run{color:var(--accent)}.res.idle{color:var(--ink-3)}
.mail{margin-top:6px;font-size:12px;color:var(--ink-2)}
.mail.ok{color:var(--ok)}.mail.bad{color:var(--alert)}
.thumb{margin-top:8px;width:100%;border-radius:8px;border:1px solid var(--line-2);display:block}
.clip .bar{margin-top:8px}
.clip .go{margin-left:auto;padding:4px 10px;font-size:12px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--raised);
       border:1px solid var(--line-2);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;
       pointer-events:none;max-width:80vw}
.toast.on{opacity:1}
@media (max-width:1000px){.main{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Vigía <span>Digital</span></div>
  <div class="sep"></div>
  <div class="title">Análisis de clips · aviso por correo</div>
  <div class="grow"></div>
  <span class="chip" id="mailChip"><span class="dot"></span><span id="mailMode">Correo…</span></span>
  <button class="btn" id="btnTest" onclick="testMail()">Correo de prueba</button>
  <button class="btn primary" id="btnRun" onclick="runAll()">Analizar los clips</button>
  <button class="btn danger hidden" id="btnStop" onclick="stopRun()" style="display:none">Detener</button>
  <a class="link" href="/operator/" target="_blank" rel="noopener">Panel de operador ↗</a>
</header>

<main class="main">
  <section class="stage">
    <div class="video">
      <img id="feed" alt="Video procesado de la cámara" hidden>
      <div class="empty" id="empty"><b>Cámara IP en espera</b>Presiona «Analizar los clips» para conectar la cámara.</div>
      <div class="overlay" id="overlay" hidden>
        <span class="live">● EN VIVO</span>
        <span class="cam" id="ovCam"></span>
        <span class="where" id="ovWhere"></span>
      </div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <div class="stats">
      <div class="stat"><div class="k">Clips analizados</div><div class="v mono" id="sAn">0</div></div>
      <div class="stat"><div class="k">Caídas detectadas</div><div class="v mono" id="sFall">0</div></div>
      <div class="stat"><div class="k">Falsas alarmas</div><div class="v mono" id="sFp">0</div></div>
      <div class="stat"><div class="k">Correos</div><div class="v mono" id="sMail">0</div></div>
    </div>
  </section>

  <aside class="side">
    <h2><span>Clips</span><span class="mono" id="method"></span></h2>
    <div class="list" id="list"></div>
  </aside>
</main>
<div class="toast" id="toast"></div>

<script>
const API = '/analisis/api';
let state = null, ws = null, lastFrameUrl = null, seenFalls = {};

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),4000);}

async function api(path, body){
  const r = await fetch(API + path, body === undefined ? {} :
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}

// Video: el WebSocket del panel de operador envía JSON (estado) + JPEG (cuadro).
function connectVideo(camId){
  if (ws) return;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/operator/ws/live/' + encodeURIComponent(camId));
  ws.binaryType = 'blob';
  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') return;
    const url = URL.createObjectURL(ev.data);
    const img = document.getElementById('feed');
    img.onload = () => { if (lastFrameUrl) URL.revokeObjectURL(lastFrameUrl); lastFrameUrl = url; };
    img.src = url; img.hidden = false;
    document.getElementById('empty').hidden = true;
  };
  ws.onclose = () => { ws = null; setTimeout(() => state && connectVideo(state.camara.id), 1500); };
}

const RES = {
  acierto_caida:      ['Caída detectada', 'ok'],
  caida_no_detectada: ['Caída NO detectada', 'bad'],
  acierto_sin_caida:  ['Sin alarma', 'ok'],
  falsa_alarma:       ['Falsa alarma', 'bad'],
};

function clipCard(c){
  const active = state.actual === c.id;
  const exp = c.esperado === 'caida'
    ? '<span class="tag exp-c">Caída simulada</span>' : '<span class="tag exp-n">Actividad normal</span>';
  let res;
  if (c.estado === 'analizando') res = `<span class="res run">Analizando… ${Math.round((c.avance||0)*100)}%</span>`;
  else if (c.estado === 'en_cola') res = '<span class="res idle">En cola</span>';
  else if (c.estado === 'error') res = `<span class="res bad">Error: ${esc(c.error)}</span>`;
  else if (c.estado === 'detenido') res = '<span class="res idle">Detenido</span>';
  else if (c.resultado) { const [t, k] = RES[c.resultado]; res = `<span class="res ${k}">${t}</span>`; }
  else res = c.existe ? '<span class="res idle">Pendiente</span>' : '<span class="res bad">Falta el video</span>';
  const hora = c.hora_deteccion ? `<span class="mono">· ${esc(c.hora_deteccion)}</span>` : '';
  const mail = c.correo ? `<div class="mail ${c.correo_ok === false ? 'bad' : c.correo_ok ? 'ok' : ''}">📧 ${esc(c.correo)}</div>` : '';
  const thumb = c.tiene_imagen ? `<img class="thumb" src="${API}/imagen/${encodeURIComponent(c.id)}?t=${encodeURIComponent(c.hora_deteccion||'')}" alt="Cuadro de la caída del clip ${esc(c.id)}">` : '';
  const bar = active ? `<div class="bar"><i style="width:${Math.round((c.avance||0)*100)}%"></i></div>` : '';
  const go = `<button class="btn go" ${state.ocupado || !c.existe ? 'disabled' : ''} onclick="runOne('${esc(c.id)}')">Analizar</button>`;
  return `<article class="clip ${active ? 'active' : ''} ${c.caidas ? 'fall' : ''}">
    <div class="row"><span class="cid">#${esc(c.id)}</span><span class="where2">${esc(c.ubicacion)}</span>${exp}</div>
    <div class="meta mono">${esc(c.duracion_s)} s</div>
    <div class="status">${res} ${hora} ${go}</div>${bar}${mail}${thumb}
  </article>`;
}

function render(){
  const s = state;
  const chip = document.getElementById('mailChip');
  chip.className = 'chip ' + (s.correo.modo === 'real' ? 'real' : 'sim');
  document.getElementById('mailMode').textContent = s.correo.modo === 'real'
    ? `Envío real → ${s.correo.destinatarios.length} destinatario${s.correo.destinatarios.length === 1 ? '' : 's'}`
    : 'Correo simulado (sin envío)';
  chip.title = s.correo.destinatarios.join(', ');
  document.getElementById('method').textContent = 'criterio ' + s.metodo;
  document.getElementById('btnRun').disabled = s.ocupado;
  document.getElementById('btnStop').style.display = s.ocupado ? '' : 'none';
  document.getElementById('btnStop').classList.toggle('hidden', !s.ocupado);

  const cur = s.clips.find(c => c.id === s.actual);
  const ov = document.getElementById('overlay');
  ov.hidden = !cur;
  if (cur) {
    document.getElementById('ovCam').textContent = s.camara.nombre;
    document.getElementById('ovWhere').textContent = '· ' + cur.ubicacion;
  }
  document.getElementById('progress').style.width = cur ? Math.round((cur.avance||0)*100) + '%' : '0%';

  const r = s.resumen;
  document.getElementById('sAn').textContent = r.analizados + '/' + s.clips.length;
  document.getElementById('sFall').innerHTML = `${r.caidas_detectadas}<small>/${r.caidas_esperadas}</small>`;
  document.getElementById('sFp').textContent = r.falsas_alarmas;
  document.getElementById('sMail').textContent = r.correos;

  document.getElementById('list').innerHTML = s.clips.map(clipCard).join('');

  // Destello rojo en el video cuando aparece una caída nueva.
  s.clips.forEach(c => {
    if (c.caidas > (seenFalls[c.id] || 0)) {
      const f = document.getElementById('flash'); f.classList.add('on');
      setTimeout(() => f.classList.remove('on'), 1600);
    }
    seenFalls[c.id] = c.caidas;
  });
}

async function refresh(){
  try { state = await api('/estado'); render(); connectVideo(state.camara.id); }
  catch (e) { /* servidor reiniciándose: reintenta en el siguiente ciclo */ }
}
async function runAll(){ try { seenFalls = {}; await api('/iniciar', {ids:null}); refresh(); } catch(e){ toast(e.message); } }
async function runOne(id){ try { await api('/iniciar', {ids:[id]}); refresh(); } catch(e){ toast(e.message); } }
async function stopRun(){ try { await api('/detener', {}); toast('Deteniendo al final del cuadro actual…'); } catch(e){ toast(e.message); } }
async function testMail(){
  const b = document.getElementById('btnTest'); b.disabled = true; b.textContent = 'Enviando…';
  try { const r = await api('/probar-correo', {}); toast((r.ok ? '✓ ' : '✗ ') + r.texto); }
  catch(e){ toast(e.message); }
  finally { b.disabled = false; b.textContent = 'Correo de prueba'; }
}
refresh(); setInterval(refresh, 700);
</script>
</body>
</html>
